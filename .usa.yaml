  - rule: NODE-008
    reviewed: 2026-09-15
    until: 2027-03-15
    by: sajan
    note: >-
      ESM throughout, verified 2026-09-15: package.json type module, zero
      require( calls in src, every relative import carries its extension.
      No CJS anywhere to conflict with.

  - rule: CICD-003
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Merged commit to production with no human typing commands anywhere:
      release-please PR, squash, tag, and the Release workflow publishes to
      npmjs plus the GPR mirror, attests, verifies, and files provenance —
      observed across a dozen releases with zero manual publishes. The
      documented workflow_dispatch fallback needs no server access either.

  - rule: CICD-004
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Procedure documented in docs/release.md Rollback (deprecate plus
      repoint latest on npmjs, delete the GitHub release, delete the GPR
      version, announce via patch notes); registry mutations need a human
      classic token by design. Never exercised — the closest event was a
      fail-closed duplicate publish, which is prevention, not rollback.
      Re-review immediately after first real use.

  - rule: DEP-002
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Settled 2026-10-22 with the tool rather than by reading: `trivy fs
      --scanners vuln --severity HIGH,CRITICAL` reports 0 findings once
      fixtures/ is excluded. The 5 lodash 4.17.4 CVEs it does report all live
      in fixtures/insecure-app/package-lock.json, which is planted on purpose
      and excluded from the self-audit by .usa.yaml. First review of this item
      — it was previously "never".

  - rule: AI-011
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Read AGENTS.md 2026-10-22 (the only instruction file in the tree — no
      CLAUDE.md or .cursorrules). It forbids destructive operations without a
      verified backup (L174), forbids hand-pushed v* tags (L308), and keeps
      secrets out of the tree with .env gitignored (L316). GAP found: it
      contains no explicit "never push to main, always branch then PR" rule —
      that constraint lives in the operator's standing instruction and in
      branch protection, not in the file an agent actually reads. First review
      of this item — previously "never".
