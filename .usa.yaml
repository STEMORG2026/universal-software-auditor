# USA configuration for this repository (it audits itself).
# Docs: docs/configuration.md
version: 1

# `rules/` is USA's *content*, not its source. Grepping it would report every
# technology this template merely mentions — "dynamodb" appears in a rule pack,
# not in an import — so it is excluded from the index, the same way node_modules
# is. (Markdown and docs/ are already skipped by the detector itself.)
ignore:
  - 'rules/**'
  - '.usa.yaml'
  # `examples/demo-app` is *deliberately* full of defects — it exists so
  # examples/sample-report.md shows what a bad audit looks like. Auditing it as
  # part of this repo would report every one of those planted findings against
  # USA itself. Run `usa audit examples/demo-app` to see the real thing.
  - 'examples/demo-app/**'
  # `fixtures/insecure-app` and `fixtures/secure-app` are planted on purpose: a
  # lockfile full of known CVEs and a dynamic eval sink. Auditing them inside
  # this repo would report every planted defect against USA itself — the same
  # reason demo-app is excluded. `usa scan fixtures/insecure-app` runs them.
  - 'fixtures/**'

# Suppressions — accepted risk, always with a reason. They stay visible in the
# report (under "Accepted risk") but are excluded from the score.
suppressions:
  - rule: CICD-006
    reason: >-
      No infrastructure to define. USA is a CLI distributed through npm and
      GitHub Actions; it has no servers, clusters, or cloud resources to
      provision, so there is nothing for Terraform or a Dockerfile to describe.
      Revisit the day the project ships a hosted service.

  - rule: REPO-002
    file: .npmrc
    reason: >-
      The root .npmrc carries only the @xenos1996 scope-to-registry address
      (one mapping line, no credentials). REPO-002 bans .npmrc categorically
      because most committed copies leak tokens; this one cannot — NODE-004
      keeps guarding its contents, and any added credential line fails the
      gate. Revisit if the file ever needs more than the address.

  - rule: COMP-010
    reason: >-
      The root LICENSE file covers the entire repository under a single MIT
      licence, and every published artefact inherits it. Per-file SPDX headers
      are not this project's convention; adding them would be ceremony without
      a compliance requirement behind it.

  - rule: REL-004
    reason: >-
      No staged-rollout surface exists to flag. USA ships as a versioned CLI
      through npm (and a composite action); risky changes gate on CI, review,
      and the release-please Release PR instead of runtime flags. Revisit the
      day the project ships a hosted service.

  - rule: AI-007
    reason: >-
      No retrieval, no vector store, no tenants: source search finds no
      embedding, vector-store, tenant, or retrieval machinery in src/ — USA
      is a single-user local CLI over the user's own checkout, so there is
      no cross-tenant boundary to isolate. Revisit the day retrieval is
      added, at which point this suppression must burn.

  - rule: TAS-006
    reason: >-
      Thresholds are enforced, just not in jest: there is no jest in this
      repo. Coverage floors live in vitest.config.ts and TEST-005 (which
      checks they are enforced) passes. Pinning a jest key in package.json
      for a vitest project would be decoration.

  - rule: FND-013
    reason: >-
      package.json scripts are the task runner here (build, lint, test,
      docs, release, self-audit) — every workflow in the contributing path
      runs through them. A Makefile would duplicate that surface for no
      new capability. Revisit if workflows ever need orchestration npm
      scripts cannot express.

  - rule: TAS-005
    reason: >-
      Coverage is measured on every CI run (vitest --coverage in the Test
      job) with enforced ratcheting thresholds (TEST-005 passes) and the
      numbers visible in CI logs. There is no hosted coverage service by
      choice — a .codecov.yml without the service behind it would be
      decoration, not evidence.

  - rule: FND-011
    reason: >-
      The environment is reproducible from checked-in files: .nvmrc pins
      the runtime, package-lock.json pins the tree, npm scripts capture
      every workflow. Containers solve a deployment problem this project
      does not have (see CICD-006) — a Dockerfile would be the second
      file this rule counts, added for the count rather than a need.

  - rule: FND-004
    reason: >-
      Protection verified via API, not via a snapshot file: six required
      checks, no force pushes, no deletions, CODEOWNERS review required,
      stale reviews dismissed. A checked-in copy would rot without drift
      automation, and settings-as-code is disproportionate for a
      single-branch repo. Revisit with a drift check, not a snapshot.

# Reviews — dated human attention (ADR-0023). A review never changes a
# verdict; it records that someone looked, with evidence, and when to look
# again. Stale reviews warn instead of silently rotting.
reviews:
  - rule: REPO-003
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Ran the history scan by hand 2026-09-14: every match is a known fake —
      the tracked-exclude test fixture, the planted demo-app defect, and its
      rendered examples in README and the sample reports. No live secrets, no
      rotation indicated. Deliberately a review, not a suppression: a future
      real leak must still fail loudly.

  - rule: SUP-012
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Verified via live API 2026-10-22: 7 required checks (Lint & format, Test,
      Build, Validate rule packs, Docs & ADR hygiene, USA audit, Changeset
      present), strict so a branch must be current, CODEOWNERS review required,
      stale reviews dismissed, no force pushes, no deletions, conversation
      resolution required. GAP found: enforce_admins is false, so an account
      with admin can bypass every one of these. That is the one criterion this
      rule asks for that is not met, and it is recorded here rather than
      papered over.
  - rule: REL-001
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-verified 2026-10-22: package.json at 2.28.0, published to npmjs, and
      the bump is chosen by the changeset note (patch/minor/major), never by
      hand. Two patch notes are pending, which is why the release PR proposes
      2.28.1. The 2026-09-14 note said 2.9.2 — that is how fast this rots.
  - rule: REL-002
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-verified 2026-10-22: 51 tags, newest @xenos1996/usa@2.28.0, pushed by
      changesets/action on publish — not by hand. AGENTS.md forbids hand-pushed
      v* tags. Note the tag shape changed from v2.9.x to @xenos1996/usa@2.x.y
      when the release tooling changed; the older note listing v2.8.0-v2.9.2 is
      stale on that point.
  - rule: CICD-002
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-verified 2026-10-22: ci.yml fires on pull_request with no branch
      filter (the #197 fix — narrowing it once gave a stacked PR zero CI).
      Jobs: lint, test, build, rules, commits, changesets, hygiene, resync,
      security, analyze. Lint, typecheck (inside test), test and build all run.
      The Test job now also installs semgrep 1.182.0 and trivy 0.75.0 so two
      scanner e2e tests actually execute instead of skipping.
  - rule: DOC-001
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-verified 2026-10-22: what (title and strapline, L3-5), install and run
      both under Quick start (L36, npx/npm usage), contribute (L316) plus a
      separate CONTRIBUTING.md. All four covered; install and run share one
      heading rather than having one each.
  - rule: CLI-003
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Every writing command honors --dry-run (audit, diff, learn,
      bootstrap, evolve, init, live, foundation init): prints resolved
      would-write paths and exits 0 before any work, covered by 9 tests.
      init and foundation init additionally refuse to clobber existing
      files. The store is content-addressed append-only, benchmark rm
      targets owned scratch only, and no CLI command deletes user files or
      publishes — so there is no destructive path left without a preview.

  - rule: AI-001
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Single choke point (live/runner.ts modelTurn): system prompt carries
      an instruction-hierarchy guard, user content is fenced as data, and
      only sanitized values plus aggregate counts ever reach the model —
      never raw repo text, never free-text answers (pinned by an
      adversarial test feeding injection attempts through a full session).
      The model has no tools anywhere (pure text in/out), and its output
      goes only to the terminal and the labeled transcript — never parsed,
      executed, or written to repo files. Residual: misleading transcript
      text is the maximum impact; no privileged sink exists.

  - rule: CLI-004
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Stdin is bounded (readCappedLine caps one line at 64 KiB and throws
      instead of buffering piped infinity; both callers fail loudly with
      exit 2). Shell is never invoked: the only subprocesses are execFile
      with argument vectors (git, cosign), so --cosign-binary cannot inject.
      All --out writers share writeTextFile (parents created, clean exit 2
      on failure instead of raw ENOENT crash). Input paths are resolved and
      existence-checked; --dry-run previews every write.

  - rule: TEST-009
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-run 2026-10-22: `vitest run --sequence.shuffle` gives 70 files, 1447
      passed, 1 skipped — identical to the ordered run. Suite also green on
      consecutive runs today. One run during this session showed 4 e2e failures
      that did not reproduce and pass in isolation; the cause was NOT isolated,
      so it is recorded as unexplained rather than dismissed as flake.
  - rule: CLI-006
    reviewed: 2026-10-22
    until: 2027-04-22
    by: sathi
    note: >-
      Re-measured 2026-10-22 by redirection: `usa audit /nonexistent` exits 2
      with 0 bytes on stdout and 50 on stderr ("Target path does not exist");
      `usa --version` writes to stdout with 0 bytes on stderr. Same contract as
      the 2026-09-14 note, re-confirmed rather than assumed.
  - rule: CLI-005
    reviewed: 2026-09-14
    until: 2027-03-14
    by: sajan
    note: >-
      Verified 2026-09-14 by running everything twice: audit reruns are
      byte-identical except timestamps; init and foundation init refuse the
      second run with already-exists messages (exit 0); learn and bootstrap
      outputs identical; diff is a pure function of its inputs; evolve
      appends through the content-addressed store (hash dedup, tested).
      Live transcripts intentionally overwrite — each session is new input,
      not a repeated operation.

  - rule: REPO-015
    reviewed: 2026-09-15
    until: 2027-03-15
    by: sajan
    note: >-
      Last twenty commits all conventional and descriptive (release-please
      releases, feat/fix/docs/chore with scopes); the commitlint hook plus
      the Conventional commits CI job make anything else unmergeable.

  - rule: DEP-004
    reviewed: 2026-09-15
    until: 2027-03-15
    by: sajan
    note: >-
      One runtime dependency (yaml) — redundancy is structurally
      impossible. Dev dependencies are single-purpose each; no two
      libraries do the same job.

  - rule: DEP-006
    reviewed: 2026-09-15
    until: 2027-03-15
    by: sajan
    note: >-
      SPDX inventory from the CycloneDX SBOM 2026-09-15: MIT, ISC,
      Apache-2.0, BSD-2/3-Clause, BlueOak, Python-2.0 — no GPL/AGPL
      anywhere. Weakest copyleft is MPL-2.0 (lightningcss, transitive dev
