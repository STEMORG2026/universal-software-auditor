# USA configuration for this repository (it audits itself).
# Docs: docs/configuration.md
version: 1

# `rules/` is USA's *content*, not its source. Grepping it would report every
# technology this template merely mentions — "dynamodb" appears in a rule pack,
# not in an import — so it is excluded from the index, the same way node_modules
# is. (Markdown and docs/ are already skipped by the detector itself.)
ignore:
  - 'rules/**'
  - '.usa.yaml'
  # `examples/demo-app` is *deliberately* full of defects — it exists so
  # examples/sample-report.md shows what a bad audit looks like. Auditing it as
  # part of this repo would report every one of those planted findings against
  # USA itself. Run `usa audit examples/demo-app` to see the real thing.
  - 'examples/demo-app/**'
  # `fixtures/insecure-app` and `fixtures/secure-app` are planted on purpose: a
  # lockfile full of known CVEs and a dynamic eval sink. Auditing them inside
  # this repo would report every planted defect against USA itself — the same
  # reason demo-app is excluded. `usa scan fixtures/insecure-app` runs them.
  - 'fixtures/**'

# Suppressions — accepted risk, always with a reason. They stay visible in the
# report (under "Accepted risk") but are excluded from the score.
suppressions:
  - rule: CICD-006
    reason: >-
      No infrastructure to define. USA is a CLI distributed through npm and
      GitHub Actions; it has no servers, clusters, or cloud resources to
      provision, so there is nothing for Terraform or a Dockerfile to describe.
      Revisit the day the project ships a hosted service.

  - rule: REPO-002
    file: .npmrc
    reason: >-
      The root .npmrc carries only the @xenos1996 scope-to-registry address
      (one mapping line, no credentials). REPO-002 bans .npmrc categorically
      because most committed copies leak tokens; this one cannot — NODE-004
      keeps guarding its contents, and any added credential line fails the
      gate. Revisit if the file ever needs more than the address.

  - rule: COMP-010
    reason: >-
      The root LICENSE file covers the entire repository under a single MIT
      licence, and every published artefact inherits it. Per-file SPDX headers
      are not this project's convention; adding them would be ceremony without
      a compliance requirement behind it.

  - rule: REL-004
    reason: >-
      No staged-rollout surface exists to flag. USA ships as a versioned CLI
      through npm (and a composite action); risky changes gate on CI, review,
      and the release-please Release PR instead of runtime flags. Revisit the
      day the project ships a hosted service.

  - rule: AI-007
    reason: >-
      No retrieval, no vector store, no tenants: source search finds no
      embedding, vector-store, tenant, or retrieval machinery in src/ — USA
      is a single-user local CLI over the user's own checkout, so there is
      no cross-tenant boundary to isolate. Revisit the day retrieval is
      added, at which point this suppression must burn.

  - rule: TAS-006
    reason: >-
      Thresholds are enforced, just not in jest: there is no jest in this
      repo. Coverage floors live in vitest.config.ts and TEST-005 (which
      checks they are enforced) passes. Pinning a jest key in package.json
      for a vitest project would be decoration.

  - rule: FND-013
    reason: >-
      package.json scripts are the task runner here (build, lint, test,
      docs, release, self-audit) — every workflow in the contributing path
      runs through them. A Makefile would duplicate that surface for no
      new capability. Revisit if workflows ever need orchestration npm
      scripts cannot express.

  - rule: TAS-005
    reason: >-
      Coverage is measured on every CI run (vitest --coverage in the Test
      job) with enforced ratcheting thresholds (TEST-005 passes) and the
      numbers visible in CI logs. There is no hosted coverage service by
      choice — a .codecov.yml without the service behind it would be
      decoration, not evidence.

  - rule: FND-011
    reason: >-
      The environment is reproducible from checked-in files: .nvmrc pins
      the runtime, package-lock.json pins the tree, npm scripts capture
      every workflow. Containers solve a deployment problem this project
      does not have (see CICD-006) — a Dockerfile would be the second
      file this rule counts, added for the count rather than a need.

  - rule: FND-004
    reason: >-
      Protection verified via API, not via a snapshot file: six required
      checks, no force pushes, no deletions, CODEOWNERS review required,
      stale reviews dismissed. A checked-in copy would rot without drift
      automation, and settings-as-code is disproportionate for a
      single-branch repo. Revisit with a drift check, not a snapshot.

  # The Python pack now fires because this repository ships one Python file:
  # `scripts/macp/hooks/adapters/hermes_plugin.py`, a ~60-line adapter for a
  # Python host (Hermes), stdlib-only (json/os/subprocess/pathlib/typing). It
  # is copied into the host's plugin directory and executed there; the Node
  # runtime never imports it. There is no Python package, no third-party
  # Python dependency, and no Python CI job — so the four rules below ask
  # questions whose premise is false here. They stay listed (not silently
  # dropped) and must burn the moment a second `.py` file with a third-party
  # import appears.
  - rule: PY-001
    reason: >-
      No Python manifest exists because there are no Python dependencies to
      declare. The single adapter imports only the standard library. Adding a
      pyproject.toml would create the appearance of a package that nothing
      builds, tests, or publishes.
  - rule: PY-003
    reason: >-
      Nothing to pin. Pinning is for third-party packages; this adapter has
      none. An empty requirements.txt with a comment would satisfy the pattern
      and prove nothing.
  - rule: PY-002
    reason: >-
      This repository does not choose a Python runtime. The adapter runs inside
      whatever interpreter Hermes already uses, on the machine that installed
      it; there is no Python step in CI to pin against.
  - rule: PY-010
    reason: >-
      No Python code is authored here beyond one glue file that is reviewed by
      the same PR gate as the rest of the tree. A ruff configuration would lint
      60 lines once and then need its own maintenance.

# Reviews — dated human attention (ADR-0023). A review never changes a
# verdict; it records that someone looked, with evidence, and when to look
# again. Stale reviews warn instead of silently rotting.
