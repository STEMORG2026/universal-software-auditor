# Static analysis. USA's own rule SUP-006 asks whether SAST runs in CI, so this
# repo runs it. CodeQL is free for public repositories.
#
# Note: this is *Advanced* setup. If the repository has CodeQL *Default* setup
# enabled instead, the analysis step reports the conflict rather than blocking a
# merge — a settings change cannot be made from a pull request.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 06:17 UTC Mondays — off the hour, so we are not queued behind everyone else.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          # Plural `languages` is the current input; the singular `language`
          # falls back to autodetection, which tries to build a Python database
          # for a repository that contains no Python.
          languages: javascript-typescript
          # Skips examples/demo-app, whose defects are planted on purpose.
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        continue-on-error: true
        with:
          category: '/language:javascript-typescript'
