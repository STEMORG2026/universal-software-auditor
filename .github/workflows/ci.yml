name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the default GITHUB_TOKEN gets read-only unless a job asks for
# more. (Yes, USA checks this on the projects it audits — it applies to itself.)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: Prettier
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # SUP-010, enforced at PR time rather than left to the monthly Scorecard
      # run. Catches a `uses: owner/action@v4` that slipped in without a PIN
      # — the drift produced 59 open Scorecard findings before 2026-09-17.
      - name: Actions are pinned to commit SHAs
        run: pnpm run actions:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/e2e.test.ts audits this repo and asserts zero warnings; a
          # shallow (depth-1) checkout looks like a single-commit history, so
          # USA emits a "shallow clone?" warning and the assertion fails.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run build

      - name: Smoke test the CLI
        run: |
          node dist/cli.js version
          node dist/cli.js rules | tail -3
          node dist/cli.js explain SEC-001 | head -5

  rules:
    name: Validate rule packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Every pack loads and every rule parses
        run: |
          node dist/cli.js rules | tail -1 | tee /tmp/rules.txt
          grep -qE '^[0-9]{3,} rule' /tmp/rules.txt || { echo "rule count looks wrong"; exit 1; }

      - name: Detection still works on this repo
        run: |
          node dist/cli.js detect . | grep -q 'maturity:'

  # Commit messages still drive the CHANGELOG (changesets copies them in), so
  # they stay linted like code. PR-only: master receives squash/rebase merges
  # whose messages GitHub derives from PR titles — lint the PR commits, not
  # merges.
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # SHAs resolve via `gh`, never by interpolating pull-request payload
      # fields into `run:` blocks: SUP-008 forbids event-payload text there
      # (it matches comments too, hence this careful wording), even where
      # the value is server-generated hex. The numeric event number below
      # is outside that rule's pattern by construction.
      - name: Lint commit messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          BASE_SHA="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # A version only moves when a note says so. `change-status` answers the one
  # question that matters: does this PR's diff touch shipped files without
  # adding a changeset? It exits 1 for exactly that case and 0 otherwise, so
  # a chore/docs/ci PR passes untouched and a src/rules PR must carry a note.
  # Shipped paths are the ones `files` in package.json publishes plus the
  # action manifest — a note is pointless for a change nobody downloads.
  changesets:
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Compare against the base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BASE_SHA="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          HEAD_REF="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"

          # The release PR is the one legitimate exception: it bumps versions
          # and CONSUMES notes, so demanding a new one deadlocks the release
          # (found the hard way — this gate failed the very first Version
          # Packages PR, and it is a required check). Two independent signals,
          # either sufficient: the action's own branch name, and deleted
          # notes. The branch name alone would break if changesets renamed its
          # branch; deleted notes alone would miss a release that also adds one.
          if [[ "$HEAD_REF" == changeset-release/* ]]; then
            echo "Release branch ($HEAD_REF) — the version PR consumes notes by design."
            exit 0
          fi

          # Does the diff touch anything the package ships?
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(src/|rules/|templates/|action\.yml|package\.json)'; then
            echo "No shipped paths touched — a changeset is not required."
            exit 0
          fi

          # Shipped paths changed: is a note in the PR's diff? A note is an
          # ADDED .changeset/*.md that is not the directory's own README.
          # The exclusion has to live in the same pattern: a separate
          # `grep README` over the whole diff reports the README this
          # directory ships with and inverts to a false negative (this gate's
          # first real run failed on exactly that).
          NOTES="$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" \
                   | grep -E '^\.changeset/[^/]+\.md$' \
                   | grep -vE '^\.changeset/README\.md$' || true)"
          if [ -n "$NOTES" ]; then
            echo "Shipped paths + a changeset found:"
            echo "$NOTES"
            exit 0
          fi

          # A diff that removes notes is mid-version-bump even off the
          # canonical branch (e.g. a hand-cut release PR).
          CONSUMED="$(git diff --name-only --diff-filter=D "$BASE_SHA" "$HEAD_SHA" \
                      | grep -E '^\.changeset/[^/]+\.md$' \
                      | grep -vE '^\.changeset/README\.md$' || true)"
          if [ -n "$CONSUMED" ]; then
            echo "This PR consumes changesets (version bump):"
            echo "$CONSUMED"
            exit 0
          fi

          echo "::error::This PR changes shipped files but adds no changeset."
          echo "Run \`pnpm changeset\`, commit the note, push again."
          echo "Skip this gate only by leaving shipped paths untouched."
          exit 1

  hygiene:
    name: Docs & ADR hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # dist/ is required by check-docs (flag references run --help) and
      # gen-cli-docs --check. check-docs used to run before the build and
      # failed with MODULE_NOT_FOUND on both stacked PRs.
      - run: pnpm run build

      - name: ADR index and numbering
        run: pnpm run docs:adrs

      - name: Doc governance (facts, links, index, version pins, headings)
        run: pnpm run docs:check

      - name: CLI reference is generated and committed
        run: pnpm run docs:cli

      - name: Sample report is generated and committed
        run: pnpm run docs:sample

      - name: ASVS coverage map is generated and committed
        run: pnpm run docs:asvs

      - name: Doc classification manifest (every doc tracked or standalone-review-dated)
        run: pnpm run docs:manifest

  # Generated files (docs/reference/cli.md, examples/sample-report.md,
  # byte-compared by the hygiene job, so any engine/CLI change turns the next
  # PR red until someone runs the generators. This job is those hands: on
  # same-repo PRs it regenerates and pushes the result back to the PR branch,
  # and the re-triggered run validates it green. No human runs a generator
  # by hand anymore.
  #
  # Boundaries, stated exactly because a bot with push access deserves them:
  # - PR-only. Master is protected; a red hygiene gate there means a human
  #   must look, not a script must push.
  # - Same-repo PRs only. A fork branch is someone else's remote — never
  #   push there.
  # - Loop-proof. A second push can only happen if the files are still dirty
  #   after a regen, which means a nondeterministic generator (a real bug).
  #   The HEAD-message guard below refuses that push so CI fails loudly
  #   instead of push-spamming forever.
  # - The hygiene --check gates stay the enforcers; this job only produces
  #   the bytes they compare. Marker sync (sync-docs) is deliberately out of
  #   scope: markers encode author intent, which belongs to a human.
  resync:
    name: Resync generated docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The head branch itself, not the merge commit, so a fix can be
          # pushed straight back. Passed as an action input, never
          # interpolated into shell (SUP-008).
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Regenerate and push if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Numeric only, like the commits job below: SUP-008 forbids
          # event-payload text in run blocks, so the head repo is resolved
          # via gh instead of ${{ github.event.pull_request… }}.
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # A fork branch lives on someone else's remote — never push there.
          # $GITHUB_REPOSITORY is runner-provided, never PR-controlled.
          HEAD_REPO="$(gh pr view "$PR_NUMBER" --json headRepository --jq .headRepository.nameWithOwner)"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "fork PR ($HEAD_REPO) — skipping push."
            exit 0
          fi
          node scripts/gen-cli-docs.mjs
          node scripts/gen-sample-report.mjs
          node scripts/gen-asvs-coverage.mjs
          if git diff --quiet -- docs/reference/cli.md docs/reference/asvs-coverage.md tests/fixtures/asvs-coverage-snapshot.json examples/sample-report.md; then
            echo "generated docs already in sync."
            exit 0
          fi
          if git log -1 --format=%s | grep -q '^docs: resync generated docs'; then
            echo "still dirty after our own resync — refusing to push again; inspect the generators."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/cli.md docs/reference/asvs-coverage.md tests/fixtures/asvs-coverage-snapshot.json examples/sample-report.md
          # Conventional: the commits job lints every PR commit with commitlint.
          git commit -m "docs: resync generated docs"
          # HEAD, not a branch name: no ref text enters the shell at all.
          git push origin HEAD
          echo "pushed resync — the re-triggered run will validate it."

  # USA audits supply-chain hygiene on other people's repos, so it runs the
  # same three scanners on itself. These are the checks behind SUP-005..007.
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      # Run the gitleaks binary directly rather than through gitleaks-action:
      # the Action ships its own default config, so the repo's .gitleaks.toml
      # (which allowlists the deliberately vulnerable demo app) is not reliably
      # applied. The binary is MIT; the Action wrapper carries the org licence.
      #
      # This repo must contain credential-shaped strings, so the build is failed
      # by scripts/gitleaks-filter.mjs rather than by gitleaks' own exit code:
      # findings in the demo app, or in the docs that quote it, are expected.
      - name: Secret scan
        run: |
          VERSION=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          set +e
          gitleaks detect --source . --no-banner --redact \
            --report-format json --report-path /tmp/gitleaks.json
          gitleaks_exit=$?
          set -e
          if [ "$gitleaks_exit" -ne 0 ] && [ ! -f /tmp/gitleaks.json ]; then
            echo "gitleaks failed to run (exit $gitleaks_exit) without producing a report"
            exit "$gitleaks_exit"
          fi
          node scripts/gitleaks-filter.mjs /tmp/gitleaks.json

      - name: License scan
        run: pnpm dlx license-checker --production --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0'
