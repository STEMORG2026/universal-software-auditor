name: Scorecard

# OpenSSF Scorecard: the machine-checkable counterpart to the posture USA
# claims in docs/standards-mapping.md. Runs the same hygiene checks (branch
# protection, token permissions, pinned deps, SAST presence, license, …)
# from the *platform* side — the API-verified view USA's file-text rules
# approximate. Results publish to the Security tab and the public dataset.
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 8 1 * *' # monthly drift check (matches self-audit cadence)
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      id-token: write # publish_results (Sigstore-signed, keyless)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to full semver: upstream publishes no `v2` major tag
      # (resolution fails with "unable to find version"), and exact pins
      # match this repo's own supply-chain rules.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
