name: Release

# The release act. changesets/action does one of two things depending on
# state, never both:
#
#   notes present  → `changeset version`: bump package.json, write CHANGELOG,
#                    open/update the "Version Packages" PR. Human reviews and
#                    merges it — that review is the release gate.
#   notes consumed → `changeset publish`: publish to npmjs via OIDC trusted
#                    publishing, then tag `vX.Y.Z`.
#
# The tag makes `publish.yml` fire, which mirrors to GitHub Packages and
# files the Sigstore bundle. The PAT is load-bearing — a version commit
# pushed by GITHUB_TOKEN never fires downstream workflows.
#
# TOKEN: fine-grained PAT (repo secret CHANGESET_TOKEN), NOT GITHUB_TOKEN.
# Needs, scoped to this repo only: Contents read+write, Pull requests
# read+write. Rotate yearly; the action fails closed without it.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Top level is read-only: Scorecard's Token-Permissions check does not treat
# changesets as a "releasing workflow" (its allowlist is semantic-release,
# GoReleaser, SLSA generators, mvn release:prepare), and it applies that
# allowlist only at job level anyway — a top-level `contents: write` is always
# a finding. The write scopes live on the job instead.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # changesets/action pushes the version commit and the tag.
      contents: write
      # It opens/updates the Version Packages PR.
      pull-requests: write
      # OIDC trusted publishing: no long-lived NPM_TOKEN. One-time owner setup:
      # npmjs.com → package Settings → Trusted Publisher → GitHub Actions,
      # this repo + workflow `release.yml`. Until then, publishing fails closed.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PAT, so the version commit re-triggers CI on master.
          token: ${{ secrets.CHANGESET_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 + npm ≥ 11.15: trusted publishing needs the OIDC exchange,
          # which Node 20's bundled npm silently never performs. Do not
          # downshift, even though the rest of CI runs on 20.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.15.0 && npm --version

      - run: pnpm install --frozen-lockfile

      # THE .npmrc TRAP, FOURTH TIME — and this time the override is tested.
      #
      # `changeset publish` shells out to `npm publish` per package, and the
      # repo-root .npmrc maps @xenos1996 to GitHub Packages. That mapping wins
      # over everything except a CLI-scoped flag — which changesets does not
      # let us pass, since it builds the command itself. Measured:
      #
      #   project .npmrc scope mapping          → GPR   (the bug)
      #   --@xenos1996:registry=…  (CLI)        → npmjs  wins
      #   npm_config_@xenos1996:registry (env)  → GPR   DOES NOT WIN
      #   NPM_CONFIG_USERCONFIG                 → GPR   DOES NOT WIN
      #   rewritten project .npmrc              → npmjs  wins
      #
      # The v2.25.2 release died exactly here: 401 from npm.pkg.github.com
      # because the publish had no GPR token. So: rewrite the scope line
      # itself. publish.yml restores the GPR mapping for the mirror leg, so
      # the two workflows never disagree about which registry is which.
      - name: Point the @xenos1996 scope at npmjs for this job
        run: |
          set -euo pipefail
          sed -i 's#^@xenos1996:registry=.*#@xenos1996:registry=https://registry.npmjs.org/#' .npmrc
          echo "effective scope registry: $(npm config get @xenos1996:registry)"

      - name: Create Release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          # v2 input names. v1 called these `version`, `publish`, `commit` and
          # `title`; v2 hard-fails on the old names with a rename table rather
          # than ignoring them — which is how this workflow's first real run
          # failed 23s in, before any package was touched.
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore(master): release'
          pr-title: 'chore(master): release'
          create-github-releases: true
          # Without this, `changeset publish` writes versions but never tags —
          # and the tag is what wakes publish.yml for the GPR mirror, SBOM and
          # provenance legs. A silent no-tag is the failure mode here.
          push-git-tags: true
          # The default (false) commits the version bump through the GitHub
          # API (@changesets/ghcommit), which deleteRefs a temp branch in a
          # `finally` block. The CHANGESET_TOKEN PAT cannot delete refs —
          # measured: "Resource not accessible by personal access token -
          # .../git/refs#delete-a-reference" on every run since Oct 1.
          # `true` pushes with `git push --force` using the checkout PAT,
          # which the PAT can do (it pushed the v2.26.0 version commit).
          push-with-git-cli: true
          # The docs are explicit: passing GITHUB_TOKEN via `env:` does NOT
          # reach the action. It must come through this input.
          github-token: ${{ secrets.CHANGESET_TOKEN }}
        env:
          # Provenance is public, verifiable build metadata on the registry —
          # what USA's own S3 rules demand of others (SUP-005..007, S3).
          NPM_CONFIG_PROVENANCE: 'true'
          # No NODE_AUTH_TOKEN here, deliberately. The job has `id-token:
          # write`; with NODE_AUTH_TOKEN unset, npm CLI (>= 11.15, installed
          # above) auto-fetches an OIDC token from GitHub — the official
          # "no token needed" trusted-publishing flow. The previous
          # `NODE_AUTH_TOKEN: ''` poisoned the .npmrc ${NODE_AUTH_TOKEN}
          # substitution and blocked the fallback, so `changeset publish`
          # died with ENEEDAUTH and v2.26.1 never reached npmjs.
