name: Publish

# Registry mirroring + provenance, split out of the release act.
#
# The release act itself lives in `release.yml` (changesets/action): it merges
# the Version Packages PR and runs `changeset publish`, which pushes to npmjs
# via OIDC trusted publishing. This workflow is the second channel and the
# evidence trail: it mirrors the SAME tarball to GitHub Packages, emits a
# CycloneDX SBOM, and files a Sigstore bundle + verification summary under
# `provenance/` through a normal PR.
#
# Triggered by the `changeset publish` tag on the version commit, or manually.
#
# THE TAG SHAPE, and why two patterns — this cost a real release (2.25.3):
# `changeset publish` does not use `v${version}` here. It asks @manypkg/tools
# for the workspace `tool`, and PnpmTool.isMonorepoRoot returns true whenever
# pnpm-workspace.yaml has a `packages:` key — it never counts the packages.
# So tool.type is "pnpm", not "root", and @changesets/cli's buildGitTag emits
# `${name}@${version}`. The tag was `@xenos1996/usa@2.25.3`, the old `v*`
# filter matched nothing, and the mirror, SBOM, attestation and provenance
# steps were silently skipped while npmjs published fine. A release that goes
# green and skips its evidence trail is the worst failure shape there is.
#
# Removing the `packages/*` glob (PR #160) did NOT fix this — verified live:
# getPackages returns tool.type "pnpm" with exactly one package.
#
# `**`, not `*`, and this is the second trap in the same pattern: GitHub's
# tag globs use `*` for "any chars EXCEPT /" and `**` for "any chars
# INCLUDING /". The tag contains a slash, so `@xenos1996/usa@*` would match
# nothing — a fix that looks right and silently does nothing, which is
# precisely the bug being fixed. `v*` stays for historical tags.
on:
  push:
    tags:
      - 'v*'
      - '@xenos1996/usa@**'
  workflow_dispatch:

# Top level is read-only on purpose. Scorecard's Token-Permissions check builds
# its workflow-type allowlist *after* validating the top level, so a top-level
# `write` is always a finding — and `contents: write`/`packages: write` there
# zero the whole check score. The job below holds exactly the writes it needs.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The provenance step files provenance/ through a pull request — creating
      # it needs pull-requests scope. (v2.9.0 tag run failed exactly here:
      # "Resource not accessible by integration" on createPullRequest.)
      contents: write
      pull-requests: write
      # GPR mirror leg.
      packages: write
      # Artifact Attestations (SUP-022) mint Sigstore bundles for the tarball.
      attestations: write
      # OIDC token exchange for npmjs trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24: trusted publishing REQUIRES npm ≥ 11.5.1 (Node ≥ 22.14).
          # On Node 20 (npm 10) the Sigstore/provenance leg succeeds but the
          # registry OIDC token exchange silently never happens — the PUT
          # goes out unauthenticated and npm 404s. Do not downgrade this.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.15.0 && npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # npmjs leg when a human dispatches by hand. The scheduled path publishes
      # through changesets/action in release.yml, so this exists only as the
      # manual fallback when that leg wedged.
      #
      # IDEMPOTENT BY DESIGN, and this is load-bearing: the FIRST dispatch of
      # this workflow died here with
      #   "You cannot publish over the previously published versions: 2.25.2"
      # which is fail-closed and correct — but it aborted the job before the
      # mirror, SBOM, attestation and provenance steps, all of which are
      # idempotent backfill work that a duplicate npmjs publish must not
      # block. Same shape as the GPR step below: check first, skip cleanly.
      #
      # --access public is mandatory: scoped packages default to restricted.
      # The scope registry is pinned explicitly IN SCOPED FORM: the repo-root
      # .npmrc points @xenos1996 at GPR, and a scoped mapping beats the plain
      # --registry default — a bare --registry flag does NOT win (v2.8.1
      # failed exactly that way: PUT went to GPR, OIDC auth, ENEEDAUTH).
      # Only a CLI-scoped override beats the project file.
      - name: Publish to npmjs (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # SCOPED form, and the plain `--registry` does NOT substitute for it:
          # the repo .npmrc maps the scope to GPR, and a scope mapping beats a
          # bare registry flag for both `npm view` and `npm publish`. Measured,
          # because assuming otherwise cost two failed runs already.
          if npm view "@xenos1996/usa@${VERSION}" version \
              --@xenos1996:registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@xenos1996/usa@${VERSION} already on npmjs — skipping publish."
            exit 0
          fi
          pnpm publish --provenance --access public --no-git-checks \
            --@xenos1996:registry=https://registry.npmjs.org

      # CycloneDX SBOM for the shipped tarball. Same preach/practice logic:
      # USA audits SBOM publication (SUP-014), so it ships one.
      #
      # WHY THE SCRATCH DIR: `npm sbom` resolves the dependency graph from
      # node_modules, and pnpm's tree is symlinked and strict — `charcodes`
      # and friends live under node_modules/.pnpm and are invisible to npm's
      # resolver, so `npm sbom` dies with ESBOMPROBLEMS on a pnpm-installed
      # tree (reproduced locally). The previous version of this step assumed
      # "the tree is complete because npm ci ran above", which stopped being
      # true the moment the repo moved to pnpm. So: build a flat npm tree in
      # a throwaway directory from the same package.json, and read that.
      #
      # Rejected: `cdxgen` (works on pnpm, but it also scans the environment
      # and prints secret NAMES to the log — unacceptable in CI), and
      # `pnpm sbom` (does not exist).
      - name: SBOM (CycloneDX)
        run: |
          set -euo pipefail
          SBOM_DIR="$(mktemp -d)"
          cp package.json "$SBOM_DIR/"
          ( cd "$SBOM_DIR" && npm install --silent --no-audit --no-fund )
          ( cd "$SBOM_DIR" && npm sbom --sbom-format cyclonedx ) > sbom.cdx.json
          rm -rf "$SBOM_DIR"
          node -e "const b=require('./sbom.cdx.json'); \
            if (!b.components || b.components.length === 0) { \
              console.error('SBOM has no components — refusing to ship an empty bill of materials'); \
              process.exit(1); \
            } \
            console.log('SBOM: ' + b.components.length + ' components (' + b.bomFormat + ')');"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usa-sbom
          path: sbom.cdx.json

      # GitHub Packages mirror: the repo's Packages tab only lists packages
      # hosted on npm.pkg.github.com — npmjs releases never appear there.
      # Same tarball, second registry, same `@xenos1996` scope, so one
      # identity holds on both channels. GPR maps a scope to the GitHub
      # identity that owns it, and this repo's owner (Er-Sajan-PLG) is not
      # that identity — so the mirror authenticates with a classic PAT minted
      # on the scope-owning account (write:packages), stored as GPR_TOKEN.
      # Never GITHUB_TOKEN here: cross-account writes are rejected with
      # "installation does not exist". No provenance flag: GPR does not
      # consume Sigstore attestations. --access public is mandatory, not
      # cosmetic: without it npm publishes scoped packages as restricted.
      #
      # AUTH, and why this is a second setup-node rather than a hand-written
      # .npmrc: setup-node ran earlier with registry-url=npmjs, so its
      # generated npmrc carries an npmjs-scoped token line and nothing for
      # GitHub Packages. pnpm reads credentials from npmrc keyed by registry
      # host, and exporting NODE_AUTH_TOKEN alone is not enough.
      #
      # The obvious fix — printf the host-scoped auth line into .npmrc — works
      # (verified: the mirror published 2.25.2), but it trips the repo's own
      # NODE-004: that rule greps for the auth-line shape and matches the
      # mechanism as readily as a leak, failing the self-audit at CRITICAL.
      # Rather than suppress a security rule on one file, let the vendor action
      # generate the line. A new setup-node with this registry+scope writes the
      # correctly-scoped auth entry itself, so no credential-line literal
      # appears in a tracked file.
      - name: Configure GitHub Packages auth
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xenos1996'
          cache: 'pnpm'

      - name: Publish mirror to GitHub Packages
        run: |
          set -euo pipefail
          # A pre-publish existence check turns a duplicate into a clean skip
          # instead of a red run: re-running a tag whose version is already on
          # the mirror is not a failure, it is a no-op.
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@xenos1996/usa@${VERSION}" version >/dev/null 2>&1; then
            echo "@xenos1996/usa@${VERSION} already on GPR — skipping mirror."
            exit 0
          fi
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_TOKEN }}

      # SLSA provenance, preserved (SUP-022): the npmjs leg emits Sigstore
      # provenance to the registry, but a registry entry is not a repo file
      # and SUP-022 checks for a file. So: pack the release tarball, attest it
      # with GitHub Artifact Attestations, download the bundle and file it
      # under provenance/. A PR, not a direct push: this repo does not bypass
      # its own protection (SUP-012).
      - name: Pack release tarball for attestation
        run: |
          # Two steps write TARBALL/VERSION to $GITHUB_ENV, and an assignment
          # can only be read after the step that wrote it has EXITED. Inside
          # this step "$TARBALL" is still EMPTY. The earlier version hashed
          # "$TARBALL" here anyway; `sha256sum ''` failed with "No such file or
          # directory" (stderr only, exit 0), the teardown `echo` returned 0,
          # and TARBALL_SHA256 reached the provenance step as "". Measured on
          # the 2.28.3 publish run: TARBALL_SHA256: (blank). Use the shell
          # variable, not the environment entry.
          TARBALL="$(npm pack | tail -1)"
          VERSION="$(node -p "require('./package.json').version")"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # The file packaged here is NOT byte-identical to the published one:
          # npm adds an `attestations` block to package.json inside the
          # published tarball, and package.json is tarred first, so the gzip
          # stream differs from the first byte. Measured on 2.28.2: this file
          # ffc84fd7…, published 10274573…. Attested anyway, because it is the
          # same tree, built by the same workflow, from the same tag — but a
          # verification must say that in terms of THIS file's digest, never
          # pretend to be checking the registry's bytes.
          # `set -euo pipefail` so a missing tarball fails the step instead of
          # hashing nothing, and `cut -c1-64` because `cut -d' ' -f1` returns
          # the whole line when sha256sum emits a single space.
          set -euo pipefail
          TARBALL_SHA256="$(sha256sum "${TARBALL}" | cut -c1-64)"
          case "${TARBALL_SHA256}" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "refusing to file provenance: bad tarball digest '${TARBALL_SHA256}'"; exit 1 ;;
          esac
          echo "TARBALL_SHA256=${TARBALL_SHA256}" >> "$GITHUB_ENV"

      - name: Attest release tarball (SLSA provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.TARBALL }}
          # Rename the subject. GitHub identifies an attestation by subject
          # *name*, and `gh attestation verify <file>` derives the name from
          # the file — so the release tarball's own name would have to be
          # readable out of its ZIP manifest, which it is not. (Measured:
          # every release bundle at or above 2.28.0 carries subject name
          # `xenos1996-usa-X.Y.Z.tgz`, and the ZIP manifest reads 44 bytes at
          # offset 30, well past where UTF-8 has any right to work.) A SHA is
          # the one identifier both sides can compute from the file alone.
          subject-name: usa-release-${{ env.VERSION }}.tgz

      # The next step verifies the bundle with cosign before filing it, and
      # nothing installed cosign. Four earlier failures stopped one line above
      # this point (before `verify-blob-attestation`), which is why the missing
      # tool was never reached; the first run to get past attestation died with
      # `cosign: command not found`, exit 127, run 39956868762.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          # Pinned, not inherited — and it must be a v2.x, which is measured, not
          # assumed. cosign v3 releases ship `.sigstore.json` bundles and no
          # `cosign-linux-amd64.sig`; this installer verifies the download
          # against that legacy `.sig` asset, so a v3 release fails the install
          # with HTTP 22 (run 39963116205, pinning v3.1.3). No installer version
          # helps: the newest, v4.1.2, predates cosign v3 entirely.
          #
          # v2.6.5 is the newest v2.x and has the assets. The call below was run
          # verbatim against the real 2.28.4 bundle with this exact binary —
          # `Verified OK`, and a wrong digest fails with "provided artifact
          # digest does not match any digest in statement". `--digestAlg` is
          # camelCase in v2 and v3 alike; `slsaprovenance1` is in both `--type`
          # value lists.
          cosign-release: 'v2.6.5'

      - name: File provenance bundle + VSA via PR (SUP-022/SUP-023)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One attestation, one JSON document, one clean file — and the RIGHT
          # attestation. `gh attestation download -L 1` used to do this and is
          # removed: it can only address a local file path, it hashes that file
          # to find the attestation (so any byte difference is a 404), and with
          # -L 1 it returns whichever of the digest's provenances the server
          # listed first — which, after a second publish run for the same
          # version, is not necessarily the one built from the release tag.
          # The block below fetches by digest and selects on the tag ref.
          mkdir -p provenance
          # Verify the statement the bundle makes — not the local file.
          #
          # `gh attestation verify <tarball>` cannot pass here: it looks the
          # attestation up by the tarball's subject name, and the subject was
          # renamed to usa-release-X.Y.Z.tgz because the release tarball's own
          # name is unreadable out of a ZIP. Worse, even with the name matched
          # it would refuse the file: the published tarball's bytes differ
          # (see "Pack release tarball" above), and gh is documented to reject
          # a bundle whose subject name is a Go template over the digest.
          #
          # So: address the attestation by DIGEST over the REST API, take the
          # one statement this workflow signed for THIS ref, and let cosign
          # verify the signature and the DSSE statement. That checks the same
          # thing — this repository's publish workflow signed this statement —
          # against the artefact this run produced rather than against an
          # unreachable file name.
          #
          # `gh attestation download` CANNOT be used here, and this is measured
          # not assumed: its positional argument is a local FILE PATH (see
          # `gh attestation download --help` -> "[<file-path> | oci://...]").
          # There is no `name@sha256:<digest>` addressing; the whole string is
          # treated as a filename and the 2.28.3 dispatch died with
          #   failed to open local artifact:
          #   open usa-release-2.28.3.tgz@sha256:71e5278c...: no such file
          # Passing the real tarball instead fails too, from the other side: gh
          # hashes the bytes it is handed and looks THAT digest up, so the
          # 2.28.2 tarball's `attestations` block (npm rewrites package.json)
          # 404s. The API route has no such coupling.
          #
          # Retry: the attestations endpoint intermittently returns 502/504
          # (observed 3x while diagnosing this), and a release step must not
          # die on a transient upstream error.
          ATTEST_URL="repos/${GITHUB_REPOSITORY}/attestations/sha256:${TARBALL_SHA256}"
          for attempt in 1 2 3 4 5; do
            # Write to a scratch file and move it only on success: `gh api`
            # can emit a JSON error body on the same stream, so a plain
            # redirect would leave a "successful" file holding an error.
            if gh api "$ATTEST_URL" > /tmp/attestations.try.json 2>/tmp/attest.err; then
              mv /tmp/attestations.try.json /tmp/attestations.json
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "could not read attestations for sha256:${TARBALL_SHA256}"; cat /tmp/attest.err; exit 1
            fi
            echo "attestations API attempt ${attempt} failed, retrying"
            sleep 5
          done
          # The API returns EVERY provenance for this digest — a release tarball
          # accumulates one per publish run, so by the second dispatch for the
          # same version there are two with the same subject. (-L 1 would have
          # returned whichever the server listed first: nondeterministic
          # selection of the thing we are about to sign a VSA over.) Select the
          # statement built from the release TAG; anything else is another
          # run's provenance and must not be filed as this version's.
          # `export`, and this is not decoration: a bare shell assignment is
          # NOT an environment entry, so `node -e` could not see it. Measured
          # on the 2.28.3 dispatch (run 39943859454): the selector compared
          # every statement's ref against `undefined` and the step died with
          #   no provenance for 71e5278c… built from undefined (saw 3)
          # while all three attestations — including the tag one — were
          # present in the response. The digest was right; only the expected
          # ref was invisible.
          export EXPECTED_REF="refs/tags/@xenos1996/usa@${VERSION}"
          node -e '
            const fs = require("fs");
            const want = process.env.EXPECTED_REF;
            const digest = process.env.TARBALL_SHA256;
            // Fail on the cause, not on its symptom: without this, an
            // unexported ref surfaces as "no provenance … built from
            // undefined", which reads like a missing attestation.
            if (!want) {
              console.error("EXPECTED_REF is not in the environment — it must be exported, not merely assigned");
              process.exit(1);
            }
            if (!digest) {
              console.error("TARBALL_SHA256 is not in the environment");
              process.exit(1);
            }
            const doc = JSON.parse(fs.readFileSync("/tmp/attestations.json", "utf8"));
            const all = doc.attestations || [];
            const matches = [];
            for (const a of all) {
              const env = a.bundle && a.bundle.dsseEnvelope;
              if (!env) continue;
              const st = JSON.parse(Buffer.from(env.payload, "base64").toString("utf8"));
              if (st.predicateType !== "https://slsa.dev/provenance/v1") continue;
              if (st.subject?.[0]?.digest?.sha256 !== digest) continue;
              if (st.predicate?.buildDefinition?.externalParameters?.workflow?.ref !== want) continue;
              matches.push(a.bundle);
            }
            if (matches.length === 0) {
              console.error(`no provenance for ${digest} built from ${want} (saw ${all.length})`);
              process.exit(1);
            }
            // Deterministic even if two runs share the ref: sort by the DSSE
            // payload so the choice does not depend on API ordering.
            matches.sort((x, y) => (x.dsseEnvelope.payload < y.dsseEnvelope.payload ? -1 : 1));
            fs.writeFileSync("/tmp/official.bundle.json", JSON.stringify(matches[0], null, "\t"));
            console.log(`selected provenance for ${want} (${matches.length} match)`);
          '
          OFFICIAL=/tmp/official.bundle.json
          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            fs.writeFileSync("/tmp/payload.intoto.json",
              Buffer.from(doc.dsseEnvelope.payload, "base64"));
          ' "$OFFICIAL"
          # --digest, not a payload blob. `verify-blob-attestation` hashes the
          # blob it is given and (with the default --check-claims=true) requires
          # that digest to appear in the statement's subject — so passing the
          # DSSE *payload* as the blob can never pass: measured on the 2.28.3
          # bundle, it fails "provided artifact digests do not match digests in
          # statement" (exit 1). --digest names the subject directly, which is
          # the artefact the statement is actually about.
          cosign verify-blob-attestation \
            --bundle "$OFFICIAL" \
            --type slsaprovenance1 \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --digest "$TARBALL_SHA256" \
            --digestAlg sha256
          # The statement must be about THIS run's tarball, or the signature is
          # over something else and the check above would still pass.
          node -e '
            const fs = require("fs");
            const st = JSON.parse(fs.readFileSync("/tmp/payload.intoto.json", "utf8"));
            const got = st.subject?.[0]?.digest?.sha256;
            const want = process.env.TARBALL_SHA256;
            if (got !== want) {
              console.error(`statement subject ${got} != tarball ${want}`);
              process.exit(1);
            }
            if (st.predicate?.buildDefinition?.externalParameters?.workflow?.ref !==
                `refs/tags/@xenos1996/usa@${process.env.VERSION}`) {
              console.error("statement was not built from this release tag");
              process.exit(1);
            }
            console.log(`verified: tarball ${want.slice(0, 16)}… was built from the release tag`);
          '
          # Only now does the bundle become a file in the repo. Ordering is the
          # point: a bundle exists on disk if and only if cosign accepted the
          # signature and the statement named this run's tarball and tag.
          cp /tmp/official.bundle.json "provenance/v${VERSION}.sigstore.json"
          pnpm exec prettier --write "provenance/v${VERSION}.sigstore.json"
          # SUP-023: verification happened above, before anything is filed —
          # a nonzero exit there fails the job, so a VSA exists if and only if
          # it passed. Nothing below may weaken that ordering.
          # Every VSA field derives from this run (see scripts/make-vsa.mjs):
          # digests are computed, the policy digest pins this exact file.
          VSA_OUT="provenance/v${VERSION}.vsa.json" \
          VSA_TARBALL_NAME="$TARBALL" \
          VSA_TARBALL_DIGEST="$TARBALL_SHA256" \
          VSA_BUNDLE_DIGEST="$(sha256sum "provenance/v${VERSION}.sigstore.json" | cut -d' ' -f1)" \
          VSA_BUNDLE_PAYLOAD_DIGEST="$(sha256sum /tmp/payload.intoto.json | cut -d' ' -f1)" \
          VSA_VERSION="$VERSION" \
          VSA_REPO="$GITHUB_REPOSITORY" \
          VSA_SHA="$GITHUB_SHA" \
          VSA_POLICY_DIGEST="$(sha256sum .github/workflows/publish.yml | cut -d' ' -f1)" \
          VSA_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          VSA_GH_VERSION="$(gh --version | head -1 | awk '{print $3}')" \
          node scripts/make-vsa.mjs
          pnpm exec prettier --write "provenance/v${VERSION}.vsa.json"
          # Idempotent like the mirror and npmjs legs. `git push` without
          # --force is rejected once the branch exists, so a second dispatch
          # for a version that already filed its bundle died here with
          # '! [rejected] ... (fetch first)' — after doing all the work.
          # Force-pushing would rewrite a human-reviewed PR's history, so if
          # the branch is already up, the bundle is already filed: say so and
          # stop. Re-filing the same version is the re-run's desired end state
          # anyway, so this is a skip, not a failure.
          BRANCH="provenance/v${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists — bundle for v${VERSION} is already filed."
            gh pr list --head "$BRANCH" --state open --json url \
              --jq '.[] | "open PR: \(.url)"' || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "provenance/v${VERSION}.sigstore.json" "provenance/v${VERSION}.vsa.json"
          git commit -m "docs: attach SLSA provenance bundle for v${VERSION}"
          git push origin "HEAD:${BRANCH}"
          gh pr create --base master --head "$BRANCH" \
            --title "docs: attach SLSA provenance bundle for v${VERSION}" \
            --body "Sigstore bundle + verification summary for the release tarball (SUP-022/SUP-023). Verify with the commands in provenance/README.md."
