# Generated by ci-fabric. Review every command before relying on it.
# Canonical local entry point: ./ci

version = 1

[project]
name = "usa"
version = "2.28.8"
version_format = "semver"


[policy]
profile = "standard"
fail_fast = true
require_clean_worktree = "release"
keep_runs = 20
require_test_discovery = true
audit_required = false
allow_no_git = false
max_tracked_file_mib = 5.0

[repository]
required_paths = [
  "README.md",
  "LICENSE",
]
check_links = "warn"
link_globs = ["**/*.md"]
required_lockfiles = [
  "pnpm-lock.yaml",
]
check_conflict_markers = true
check_license = true

[[repository.versions]]
path = "package.json"
format = "json"
key = "version"

[stages.repository]
required = true

[stages.security]
required = true
secret_scan = true
scan_untracked = false
scan_config = true

[stages.format]
required = true
commands = [
  "pnpm run format:check",
]

[stages.lint]
required = true
commands = [
  "pnpm run lint",
]

[stages.typecheck]
required = true
commands = [
  "pnpm run typecheck",
]

[stages.unit]
required = true
commands = [
  "pnpm test",
]
test_globs = [
  "**/*.spec.js",
  "**/*.spec.jsx",
  "**/*.spec.ts",
  "**/*.spec.tsx",
  "**/*.test.js",
  "**/*.test.jsx",
  "**/*.test.ts",
  "**/*.test.tsx",
]
min_test_files = 1
allow_empty = false

[stages.audit]
required = false
commands = [
  "pnpm audit --audit-level=high",
]

[stages.build]
required = true
commands = [
  "pnpm run build",
]
outputs = [
  "dist",
]

[stages.package]
required = true
strategy = "archive"
inputs = [
  "dist",
]
output = "{artifacts}/package.tar.gz"
strip_prefix = "dist"

[stages.artifact]
required = true
verify_archives = true
scan_secrets = true
must_contain = []

[release]
require_clean = true
require_notes = true
changelog = "CHANGELOG.md"
tag_prefix = "v"
output_dir = ".localci/releases"

[hooks]
pre_commit_stages = ["repository", "format", "security"]
pre_push_stages = ["repository", "format", "lint", "typecheck", "unit", "security"]

# Deployment is opt-in. Uncomment and adapt one environment.
# [deploy.local]
# strategy = "static"
# public_dir = "."
# port = 0
# health_path = "/"
