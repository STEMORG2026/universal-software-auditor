# Ready-to-paste entries for docs/manifest.yaml.
#
# WHY: check-manifest.mjs classifies docs from `git ls-files`, so an untracked doc is
# invisible and a manifest entry for one is a "stale pointer". Add these in the SAME
# commit that first tracks audit/, then run `pnpm run docs:manifest`.
#
# Audit artefacts are a dated, point-in-time record. Evidence, not living docs —
# re-reviewing them would rewrite history. Superseded by a later audit, not edited.

