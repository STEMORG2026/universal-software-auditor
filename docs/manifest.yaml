# Documentation classification manifest (usa-doc-manifest-v1)
#
# WHY THIS FILE EXISTS (see DOCS_SYSTEM_DESIGN.md §5 E4 and ADR-0042):
# The documentation universe is machine-auditable through
# `rules/docs-taxonomy.yaml` (artifact types + impact edges). But the taxonomy
# classifies *what a project owes*, not *which human-authored files in THIS repo
# need a conscious review*. This manifest is the file-level complement: it
# forces conscious classification of every tracked markdown document so none
# can rot silently between the fact markers and the taxonomy.
#
# HOW IT WORKS:
# `scripts/check-manifest.mjs` auto-classifies each tracked *.md by its content
# or path. Most are derived, not hand-listed:
#   generated        — has a `<!-- GENERATED by … -->` marker, or is a known
#                      generator output (cli.md, asvs-coverage.md, sample-report.md)
#   fact-markered    — contains `usa:fact`/`usa:begin` markers (auto-maintained)
#   immutable-history— a doc/adr/*.md record (ADR-hygiene gates these)
#   meta             — docs/writing-docs.md (teaches the machinery; exempt)
#   changeset-note   — `.changeset/*.md` (machine-managed by changesets)
#   machine-written  — CHANGELOG.md (machine-managed by changesets)
#
# Every doc that is NOT one of the above MUST appear under `standalone:` below,
# with a `reviewed` date (ISO) and a `reason`. A `reviewed` date older than
# `review_period_days` fails the check, so prose truth is re-validated on a
# schedule the team controls — replacing the silent rot that no commit-time
# marker can catch.
#
# Add a new doc → add a standalone entry (or convert it to a marked/generated
# doc so it is auto-classified). Never leave a doc unclassified.

schema: usa-doc-manifest-v1
review_period_days: 180

# Hand-authored documentation that is neither generated, fact-markered, an ADR,
# nor machine-managed. Each entry is a promise that a human last verified the
# file's truth on (or after) the `reviewed` date.
